<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap Column Test</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .box { background-color: #f8d7da; padding: 20px; margin-bottom: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h3>col-sm-6</h3>
    <div class="row">
      <div class="col-sm-6 box">Column 1</div>
      <div class="col-sm-6 box">Column 2</div>
    </div>

    <h3>col-md-6</h3>
    <div class="row">
      <div class="col-md-6 box">Column 1</div>
      <div class="col-md-6 box">Column 2</div>
    </div>

    <h3>col-lg-6</h3>
    <div class="row">
      <div class="col-lg-6 box">Column 1</div>
      <div class="col-lg-6 box">Column 2</div>
    </div>
  </div>
</body>
</html>
